name: Production Health

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echora-production-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Echora Cloud
        run: curl --fail --silent --show-error --max-time 20 --retry 3 --retry-all-errors --retry-delay 5 https://echora-cloud.bearstozawa.workers.dev/health > /dev/null
      - name: Online music capability
        run: curl --fail --silent --show-error --max-time 20 --retry 3 --retry-all-errors --retry-delay 5 https://echora-cloud.bearstozawa.workers.dev/v1/music/status > /dev/null
      - name: Echora Web
        run: curl --fail --silent --show-error --max-time 20 --retry 3 --retry-all-errors --retry-delay 5 https://echora-web.bearstozawa.workers.dev/ > /dev/null
